name: Build VELVET APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle testReleaseUnitTest assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: velvet-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.7.1"
          fi
          VERSION="${TAG#v}"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" velvet.apk
          SHA256=$(sha256sum velvet.apk | awk '{print $1}')
          echo "Release tag: $TAG"
          echo "SHA256: $SHA256"

          cat <<EOF > update.json
          {
            "versionName": "$VERSION",
            "versionCode": $BUILD_NUMBER,
            "sha256": "$SHA256",
            "apkName": "velvet.apk"
          }
          EOF

          cat <<EOF > release_notes.md
          ### 🎵 VELVET Version $VERSION Official Release

          **SHA-256:** \`$SHA256\`

          #### 🌟 Highlights & What's New in v2.7.1:
          - 🔍 **In-Playlist Track Search**: Search and filter tracks in your saved playlists in real-time by song title or artist without disrupting custom order, drag-and-drop reordering, delete, duplicate, or undo toast.
          - 🌊 **Fluid Minimal Wavy Pulse Visualizer**: Redesigned from scratch with an aesthetic, fluid traveling harmonic wave with soft radiant ambient center bloom and toned-down theme accent color.
          - ⚡ **Real-Time Streaming Resolution Badge**: Instantaneous and accurate bitrate display (e.g. \`OPUS 160K\`, \`OPUS 50K\`, \`OFFLINE\`) with fast 150ms polling, interactive quality switching, and mathematically anchored to true screen center with absolute zero horizontal jitter.
          - ❤️ **Notification Mini Player Like Button**: Interactive Like button directly in the system media notification panel (\`ic_heart_filled\` / \`ic_heart_outline\`) that toggles like state without opening the app and updates visually in real-time.
          - ⏭️ **Notification Controls Reliability**: MediaSession ensures Next and Previous buttons are permanently visible and functional even on first standalone track playback.
          - 💫 **Tactile App-Wide Button Responsiveness**: Tactile spring-scale press animations (\`0.88f\` bounce) and subtle crisp haptics across all buttons, plus playlist Play/Pause/Shuffle buttons with dynamic active playback state indicators.
          - 🔒 **Google Play Protect Passed**: Built with Target SDK 35, 100% telemetry-free, secure RSA-2048 signing.

          Direct download: **velvet.apk** below.
          EOF

          gh release delete "$TAG" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "$TAG" velvet.apk update.json \
            --repo "${{ github.repository }}" \
            --title "Version $VERSION" \
            --notes-file release_notes.md \
            --latest
