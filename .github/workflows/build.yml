name: Build VELVET APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle testReleaseUnitTest assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: velvet-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.7"
          fi
          VERSION="${TAG#v}"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" velvet.apk
          SHA256=$(sha256sum velvet.apk | awk '{print $1}')
          echo "Release tag: $TAG"
          echo "SHA256: $SHA256"

          cat <<EOF > update.json
          {
            "versionName": "$VERSION",
            "versionCode": $BUILD_NUMBER,
            "sha256": "$SHA256",
            "apkName": "velvet.apk"
          }
          EOF

          cat <<EOF > release_notes.md
          ### 🎵 VELVET Version $VERSION Official Release

          **SHA-256:** \`$SHA256\`

          #### 🌟 Highlights & What's New:
          - 🎚️ **Poweramp-Style Pulse Wave Visualizer**: Dynamic beat-synchronized multi-frequency waveform (bass punch, vocal ripple, treble shimmer) with a warm luminous center bloom and elegant Gaussian diamond envelope. Toggleable in Settings.
          - 🎨 **All-New Expressive Now Playing Screen**:
            - Dynamic Cover Art Palette breathing gradient synced with live playback state.
            - Mathematically centered "Now Playing" header and theme accent indicator.
            - High-precision plain-text streaming resolution tag (\`OPUS 161K\`) centered between seekbar timestamps.
            - Tactile spring press-scale Play/Pause button with haptic feedback.
            - Fuller & edge-blended cover art style seamlessly merging into the dark background.
            - 100% theme accent color integration across all elements.
          - 🧠 **Autoplay Recommendation Engine V2**: Multi-factor machine intelligence prioritizing Genre > Tempo/BPM > Mood > Listening History > Era > Artist category.
          - 📜 **Dedicated Listening History**: Home clock button decoupled into standalone \`HistoryScreen\` for individual track history.
          - 📑 **Spotify-Grade Smooth Queue Swipes**: Full-length swipes (Right to Play Next, Left to Dismiss), drag-and-drop reordering, and 3-dot track menu.
          - 🔒 **Google Play Protect Certified & Permanent Keystore**: 100% telemetry-free, strict modern Target SDK 35 compliance, and permanent RSA-2048 signing for conflict-free in-app updates.

          Direct download: **velvet.apk** below.
          EOF

          gh release delete "$TAG" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "$TAG" velvet.apk update.json \
            --repo "${{ github.repository }}" \
            --title "Version $VERSION" \
            --notes-file release_notes.md \
            --latest
