name: Build VELVET APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Configure APK signing
        id: signing
        run: |
          if [ -f "keystore/velvet.jks" ]; then
            echo "Persistent release keystore found at keystore/velvet.jks."
            echo "VELVET_KEYSTORE=$(pwd)/keystore/velvet.jks" >> "$GITHUB_ENV"
            echo "VELVET_KEYSTORE_PASSWORD=velvetapp" >> "$GITHUB_ENV"
            echo "VELVET_KEY_ALIAS=velvet" >> "$GITHUB_ENV"
            echo "VELVET_KEY_PASSWORD=velvetapp" >> "$GITHUB_ENV"
            echo "is_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
            echo "Keystore not found. Using debug signing."
          fi

      - name: Build release APK
        run: gradle testReleaseUnitTest assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: velvet-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.6"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" velvet.apk
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "$TAG" velvet.apk \
            --repo "${{ github.repository }}" \
            --title "Version 2.6" \
            --notes "### VELVET Version 2.6 Official Release

**Highlights in this update:**
- **Persistent Playback State & Instant Resume**: Velvet now preserves the exact playback state across app closes. Opening the app restores the last played track, timeline position, duration, and queue without zeroing out (00:00) or failing on play. Pressing Play starts instantly right where you left off.
- **Unified Release Key Signing (Fixes Package Name / Update Conflict)**: Integrated a permanent release keystore committed directly into the build pipeline. Future APK updates and in-app upgrades install seamlessly over existing installations without 'Package conflicts with an existing package' or requiring uninstallation.
- **In-App Update Detection & Banner in About**: Settings > About now checks GitHub Releases automatically on launch and displays a high-visibility update banner with the latest release details and one-tap direct APK download/install.

**Direct Download**: Download **velvet.apk** below to install or update." \
            --latest
