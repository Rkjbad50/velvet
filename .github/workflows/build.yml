name: Build VELVET APK

on:
  push:
    branches: [main, master, 'fix/**', 'checkpoint/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish official GitHub Release (True/False)'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Exact release tag to publish (e.g. v2.7.2 - required if publish_release is true)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify (CI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Run Unit Tests & Build release APK
        run: gradle testReleaseUnitTest assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: velvet-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  release:
    name: Publish Official Release
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: velvet-apk
          path: app/build/outputs/apk/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$TAG' is not an exact semantic version tag (must start with v followed by numbers, e.g. v2.7.2)"
            exit 1
          fi

          VERSION="${TAG#v}"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [[ ! -f "$APK_FILE" ]]; then
            echo "::error::Release APK not found in artifacts"
            exit 1
          fi

          cp "$APK_FILE" velvet.apk
          SHA256=$(sha256sum velvet.apk | awk '{print $1}')
          BUILD_NUMBER=${{ github.run_number }}

          echo "Publishing Release for tag: $TAG (Version: $VERSION, Build: $BUILD_NUMBER, SHA256: $SHA256)"

          cat <<EOF > update.json
          {
            "versionName": "$VERSION",
            "versionCode": $BUILD_NUMBER,
            "sha256": "$SHA256",
            "apkName": "velvet.apk"
          }
          EOF

          cat <<EOF > release_notes.md
          ### 🎵 VELVET Version $VERSION Official Release

          **SHA-256:** \`$SHA256\`

          Official production release built and verified by CI.
          Direct download: **velvet.apk** below.
          EOF

          # Verify if release already exists. Fail safely rather than automatically deleting releases.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/updating assets without deleting release..."
            gh release upload "$TAG" velvet.apk update.json --repo "${{ github.repository }}" --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" velvet.apk update.json \
              --repo "${{ github.repository }}" \
              --title "Version $VERSION" \
              --notes-file release_notes.md \
              --latest
          fi
