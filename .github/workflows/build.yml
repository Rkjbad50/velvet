name: Build VELVET APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle testReleaseUnitTest assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: velvet-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.7.2"
          fi
          VERSION="${TAG#v}"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" velvet.apk
          SHA256=$(sha256sum velvet.apk | awk '{print $1}')
          echo "Release tag: $TAG"
          echo "SHA256: $SHA256"

          cat <<EOF > update.json
          {
            "versionName": "$VERSION",
            "versionCode": $BUILD_NUMBER,
            "sha256": "$SHA256",
            "apkName": "velvet.apk"
          }
          EOF

          cat <<EOF > release_notes.md
          ### 🎵 VELVET Version $VERSION Official Release

          **SHA-256:** \`$SHA256\`

          #### 🌟 Highlights & What's New in v2.7.2:
          - ⏯️ **Rebuilt Playlist Play / Pause / Shuffle Transport Controls**:
            - Fixed sequential Play issue where tapping Play paused, but a second tap failed or restarted from track 0.
            - Fixed Shuffle Play issue where pausing and tapping Play restarted from track 0 instead of resuming the paused shuffled song and preserving the future shuffled queue.
            - Centralized, session-aware state management across all collection headers (Local Playlists, Liked Songs, Downloads, Albums).
          - 🌊 **4 Refined Pulse Wave Visualizer Styles**:
            - Choose from 4 aesthetically modern, beat-synchronized styles in Settings:
              1. **Fluid Wave** (Silky traveling harmonic wave with soft ambient glow)
              2. **Beat Equalizer** (Symmetrical studio spectrum bars with responsive bounce and aura)
              3. **Neon Ripple** (Flowing multi-strand neon filaments with pulsing ripple nodes)
              4. **Minimal Crest** (Sleek minimalist acoustic needle profile with glowing peak)
            - Fully responsive beat-synchronization that animates during playback and smoothly freezes on pause.
          - 🧠 **Autoplay Engine V3 & Song Identity V2**:
            - **Session Dismissal Memory (`DismissedTrackRegistry`)**: Explicitly removed/swiped queue tracks are remembered and strictly barred from being re-inserted by Autoplay or background refill in the active session.
            - **Original Studio Audio Quality Gate**: Strict classification engine (`AudioClassification`) prioritizing official Topic and record label studio audio releases over lyrical uploads, dialogue film clips, and AI upscaled re-uploads.
            - **Race-Condition & Token Safety**: Dropped stale asynchronous background refill results using queue generation tokens.
          - ⚙️ **Modernized Software Update Card & Settings Clean-up**:
            - Removed "Include pre-releases" toggle from About settings.
            - Redesigned Update Section with live version status badge, animated check indicator, and clean update actions.
          - 📱 **Android 15+ Target SDK 36**:
            - Upgraded \`targetSdk = 36\` and \`compileSdk = 36\`.
            - Set minimum SDK to Android 12 (API 31) for modern Android runtime optimization.
          - 🔒 **Google Play Protect Passed**: 100% telemetry-free, zero tracking, signed release.

          Direct download: **velvet.apk** below.
          EOF

          gh release delete "$TAG" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "$TAG" velvet.apk update.json \
            --repo "${{ github.repository }}" \
            --title "Version $VERSION" \
            --notes-file release_notes.md \
            --latest
